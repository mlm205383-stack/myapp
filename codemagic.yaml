workflows:
  smartdms-pro-android-apk:
    name: ارشيف
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create Android folder
        script: |
          flutter create . --platforms=android
      - name: Set App Name to ارشيف
        script: |
          sed -i '' 's/android:label=".*"/android:label="ارشيف"/' android/app/src/main/AndroidManifest.xml || sed -i 's/android:label=".*"/android:label="ارشيف"/' android/app/src/main/AndroidManifest.xml
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - mlm205383@gmail.com
